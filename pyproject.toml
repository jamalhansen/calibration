[project]
name = "calibration"
version = "0.1.0"
description = "N=1 calibration study: how well the fleet's LLM scores predict what Jamal actually reads, how well he predicts himself, and whether reading turns into writing."
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15.0",
    "rich>=14.3.3",
    "requests>=2.32",
    "local-first-common",
    "content-discovery-agent",
    "pyyaml>=6.0.3",
]

[project.scripts]
calib = "calib.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/calib"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=6.0.0",
]

[tool.uv.sources]
local-first-common = { git = "https://github.com/jamalhansen/local-first-common.git", branch = "main" }
content-discovery-agent = { path = "../content-discovery-agent" }

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
